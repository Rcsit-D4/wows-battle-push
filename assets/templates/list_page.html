<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { margin:0; padding:22px; font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','WenQuanYi Micro Hei','WenQuanYi Zen Hei',sans-serif; $bg_style width:750px; }
.panel { background:rgba(255,255,255,0.78); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-radius:16px; padding:24px 28px 24px 36px; margin-bottom:14px; box-shadow:0 3px 16px rgba(0,0,0,0.08); border:1px solid rgba(255,255,255,0.5); max-width:660px; margin-left:auto; margin-right:auto; }
.header { text-align:center; padding:24px; }
.title { font-size:33px; font-weight:bold; color:#1a1a2e; margin-bottom:4px; }
.subtitle { font-size:14px; color:#666; letter-spacing:3px; }
.list-table { width:100%; }
.list-row { display:flex; align-items:center; padding:10px 0; border-bottom:1px solid rgba(0,0,0,0.05); font-size:18px; justify-content:center; }
.list-row:last-child { border-bottom:none; }
.list-row .col-server { min-width:80px; color:#888; text-align:center; }
.list-row .col-uid { min-width:150px; color:#0f3460; font-family:Consolas,monospace; text-align:center; }
.list-row .col-name { min-width:180px; color:#333; text-align:center; }
.list-row .col-nick { min-width:120px; color:#e94560; text-align:center; padding-left:20px; }
.list-header { font-weight:bold; color:#888; border-bottom:1px solid rgba(0,0,0,0.1); }
.empty { text-align:center; color:#999; font-size:18px; padding:20px 0; }
</style></head><body>
<div class="panel header">
<div class="title">$title</div>
<div class="subtitle">$subtitle</div>
</div>
$content
</body></html>
