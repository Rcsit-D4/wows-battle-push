<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { margin:0; padding:20px; font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','WenQuanYi Micro Hei','WenQuanYi Zen Hei',sans-serif; $bg_style width:710px; }
.panel { background:rgba(255,255,255,0.82); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-radius:18px; padding:22px 26px 22px 32px; margin-bottom:14px; box-shadow:0 4px 20px rgba(0,0,0,0.1); border:1px solid rgba(255,255,255,0.6); max-width:640px; margin-left:auto; margin-right:auto; }
.header { text-align:center; padding:26px 22px; }
.title { font-size:32px; font-weight:bold; color:#1a1a2e; margin-bottom:6px; letter-spacing:1px; }
.subtitle { font-size:14px; color:#888; letter-spacing:4px; }
.section-title { font-size:19px; font-weight:bold; color:#e94560; border-left:4px solid #e94560; padding-left:12px; margin-bottom:16px; letter-spacing:0.5px; }
.cmd-item { display:flex; align-items:center; padding:10px 4px; border-bottom:1px solid rgba(0,0,0,0.06); }
.cmd-item:last-child { border-bottom:none; }
.cmd-left { display:flex; flex-direction:column; min-width:300px; }
.cmd-en { color:#0f3460; font-weight:bold; font-family:Consolas,'Courier New',monospace; font-size:15px; }
.cmd-cn { color:#16a085; font-weight:bold; font-size:15px; margin-top:3px; }
.cmd-desc { color:#555; font-size:15px; flex:1; text-align:center; padding:0 10px; }
.content-block { text-align:left; font-size:16px; color:#444; line-height:1.8; }
</style></head><body>
<div class="panel header">
<div class="title">排行榜帮助</div>
<div class="subtitle">LEADERBOARD COMMANDS</div>
</div>
$content
</body></html>
