<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { margin:0; padding:22px; font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','WenQuanYi Micro Hei','WenQuanYi Zen Hei',sans-serif; $bg_style width:750px; }
.panel { background:rgba(255,255,255,0.78); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-radius:16px; padding:24px 28px 24px 36px; margin-bottom:14px; box-shadow:0 3px 16px rgba(0,0,0,0.08); border:1px solid rgba(255,255,255,0.5); max-width:660px; margin-left:auto; margin-right:auto; }
.header { text-align:center; padding:24px; }
.title { font-size:33px; font-weight:bold; color:#1a1a2e; margin-bottom:4px; }
.subtitle { font-size:14px; color:#666; letter-spacing:3px; }
.section-title { font-size:20px; font-weight:bold; color:#e94560; border-left:4px solid #e94560; padding-left:10px; margin-bottom:14px; }
.row { display:flex; align-items:center; padding:8px 0; border-bottom:1px solid rgba(0,0,0,0.05); font-size:18px; justify-content:flex-start; }
.row:last-child { border-bottom:none; }
.row-label { color:#888; min-width:150px; text-align:left; }
.row-value { color:#333; font-weight:bold; text-align:left; }
.tag { display:inline-block; padding:3px 14px; border-radius:12px; font-size:15px; font-weight:bold; margin-right:6px; }
.tag-on { background:#e8f5e9; color:#2e7d32; }
.tag-off { background:#fbe9e7; color:#c62828; }
.empty { text-align:center; color:#999; font-size:18px; padding:20px 0; }
</style></head><body>
<div class="panel header">
<div class="title">推送配置</div>
<div class="subtitle">BATTLE PUSH STATUS</div>
</div>
$content
</body></html>
